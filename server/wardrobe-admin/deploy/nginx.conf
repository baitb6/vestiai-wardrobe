server {
    listen 80;
    server_name ai.slongb.xyz;

    # certbot 申请证书时用于校验；日常把所有 HTTP 跳到 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name ai.slongb.xyz;

    ssl_certificate     /etc/letsencrypt/live/ai.slongb.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.slongb.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;   # 白底图上传上限 12 MB

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # 图像模型可能较慢
    }
}
